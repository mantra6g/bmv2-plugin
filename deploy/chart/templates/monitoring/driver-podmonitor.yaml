{{- if .Values.prometheus.enable }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "iml-bmv2-plugin.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "controller-manager-metrics-monitor" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podMetricsEndpoints:
    - path: /metrics
      port: metrics
      scheme: http
      interval: {{ .Values.prometheus.driverScrapeInterval }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "iml-bmv2-plugin.name" . }}
      app: driver
{{- end }}
