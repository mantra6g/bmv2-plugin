apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "iml-bmv2-plugin.name" . }}-operator
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "leader-election-role" "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

---

# RBAC for leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "iml-bmv2-plugin.name" . }}-operator
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "leader-election-rolebinding" "context" $) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "leader-election-role" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "controller-manager" "context" $) }}
    namespace: {{ .Release.Namespace }}

---

# Role for the operator to manage resources in the cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - core.loom.io
    resources:
      - networkfunctions
      - p4targets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - core.loom.io
    resources:
      - networkfunctions/finalizers
      - p4targets/finalizers
    verbs:
      - update
  - apiGroups:
      - core.loom.io
    resources:
      - networkfunctions/status
      - p4targets/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - infra.loom.io
    resources:
      - bmv2targets
      - loomnodes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - infra.loom.io
    resources:
      - bmv2targets/finalizers
      - loomnodes/finalizers
    verbs:
      - update
  - apiGroups:
      - infra.loom.io
    resources:
      - bmv2targets/status
      - loomnodes/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - scheduling.loom.io
    resources:
      - networkfunctiondeployments
      - networkfunctionreplicasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - scheduling.loom.io
    resources:
      - networkfunctiondeployments/finalizers
      - networkfunctionreplicasets/finalizers
    verbs:
      - update
  - apiGroups:
      - scheduling.loom.io
    resources:
      - networkfunctiondeployments/status
      - networkfunctionreplicasets/status
    verbs:
      - get
      - patch
      - update

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "iml-bmv2-plugin.name" . }}-operator
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "manager-rolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "manager-role" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "controller-manager" "context" $) }}
    namespace: {{ .Release.Namespace }}

---

{{- if .Values.metrics.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "metrics-auth-role" "context" $) }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
{{- end }}

---

{{- if .Values.metrics.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "metrics-auth-rolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "metrics-auth-role" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iml-bmv2-plugin.resourceName" (dict "suffix" "controller-manager" "context" $) }}
    namespace: {{ .Release.Namespace }}
{{- end }}

